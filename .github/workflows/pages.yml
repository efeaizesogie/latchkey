name: test and publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Circuits (TAP-02 build + exhaustive check)
        run: node circuit/latch.mjs
      - name: Contracts (offline tests; the X Layer fork suite runs locally with FORK=1)
        working-directory: contracts
        run: |
          npm install --no-audit --no-fund
          npx hardhat test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the single-file app (same build that goes on chain)
        working-directory: app
        env:
          LK_ONCHAIN: '1'
        run: |
          npm install --no-audit --no-fund
          npx vite build
          node scripts/check-onchain.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
